name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p ps-core --all -- --check
      - name: Clippy
        run: cargo clippy -p ps-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p ps-core

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  macos:
    name: macOS ARM64 DMG
    runs-on: macos-14
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build unsigned DMG
        run: npm run tauri -- build --bundles dmg --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: ps-macos-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows 11 installer
    runs-on: windows-latest
    needs: [core, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build unsigned installer
        run: npm run tauri -- build --bundles nsis --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: ps-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
