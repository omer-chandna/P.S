name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  macos:
    name: macOS ARM64 DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri -- build --bundles dmg --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri -- build --bundles nsis --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  draft:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [macos, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            Unsigned build. macOS Gatekeeper and Windows SmartScreen will warn until the artifacts are signed.
            Signing secrets are documented in docs/RELEASING.md and are not required for this draft.
